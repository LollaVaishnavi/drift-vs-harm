[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftharm"
version = "0.1.0"
description = "Does a population-drift alarm actually predict model harm? A labeled replay harness that scores drift detectors against realized AUC loss."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Vaishnavi Lolla" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=1.5",
]

[project.optional-dependencies]
# Dev-time evidence only. CI runs the core suite without these, and
# `make verify` never imports them. Kept separate so a cold clone proves
# the library has no hidden heavy dependency.
evidence = ["playwright>=1.40", "cmarkgfm>=2024.1"]
test = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
driftharm = "driftharm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
